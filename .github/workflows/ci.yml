name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 ist die Entwicklungsversion, 3.12 die Untergrenze. Auf 3.14 werden
        # Annotationen verzoegert ausgewertet (PEP 649), auf 3.12 nicht — Fehler
        # in Annotationen fallen sonst erst beim Nutzer auf. Genau das ist schon
        # passiert (aae7b83 "Behebe Importfehler unter Python 3.12").
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      # Stil nur einmal pruefen; er haengt nicht an der Python-Version.
      - if: matrix.python-version == '3.12'
        run: python -m ruff check .
      - if: matrix.python-version == '3.12'
        run: python -m ruff format --check .
      # Als Modul aufrufen, damit das Wurzelverzeichnis auf sys.path liegt.
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm test
      # tsc prueft nur Typen. Erst der Build zeigt, ob Vite das Bundle wirklich
      # erzeugen kann — kaputte Importe oder Assets fallen sonst nicht auf.
      - run: npm run build
